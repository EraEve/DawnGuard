# MAPFM repaired configuration
random_seed: 42
embedding_dim: 128
embedding_model_name: sentence-transformers/all-MiniLM-L6-v2
max_tfidf_features: 2400
test_size: 0.20
confidence_threshold: 0.62
retrieval_relevance_threshold: 0.24
verification_max_age_days: 365
cost_lambda: 0.72
nash_max_rounds: 6
query_uncertainty_threshold: 0.58
secure_gradient_noise_std: 0.015
agent_timeout_seconds: 10.0
enable_faiss_dense_index: true
faiss_search_multiplier: 2
dma_centroid_weight: 0.50
dma_retrieval_weight: 0.34
dma_lexical_weight: 0.12
dma_context_weight: 0.02
dma_tfa_weight: 0.02
dma_softmax_temperature: 0.18
lora_learning_rate: 0.08
gradient_margin_shift_rate: 0.02
ollama_model_name: llama3:8b
ollama_max_retries: 2
ollama_timeout_seconds: 8.0
allow_dma_legacy_fallback: true
max_concurrent_requests: 4
acute_short_window_multiplier: 3.0
chronic_long_window_multiplier: 2.0
pressure_ulcer_bedrest_growth_rate: 0.08
fall_posture_weight: 0.30
fall_activity_weight: 0.20
fall_threshold_shift: 0.08
target_classes: 22
